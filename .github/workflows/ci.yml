name: CI

# 什么时候跑：推送到主分支、以及所有 PR。
# 只看 PR 是不够的 —— 直接推 master 也会进主干，同样要过门禁。
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端（lint + 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 静态检查（只拦真错误：未定义名 / 未用导入 / 语法）
        run: ruff check .

      - name: 单元测试
        # 测试自带"禁止联网"护栏（conftest 里的 no_network），
        # 所以 CI 里不需要任何真实的 API Key —— 这也是它能在 PR 上安全跑的原因。
        run: pytest -q

      - name: 覆盖率（仅报告，暂不设阈值）
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 打包
        # vue-tsc 会抓出前后端契约不一致（字段名写错、类型不匹配），
        # 这是这个项目里最值钱的一道前端门禁。
        run: npm run build
