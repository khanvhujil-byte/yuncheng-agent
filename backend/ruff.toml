# ruff 配置：**先只拦真错误，不拦风格**。
#
# 为什么不用默认的全量规则：这个项目已经写了 8000+ 行带大量中文注释的代码，
# 一上来开全量风格规则会产生几百条"行长超限"，把真正的信号（未定义名 / 未用导入）
# 淹没在噪音里。所以第一步只开 F（pyflakes）与 E9（语法级错误），
# 等这两类清零之后再逐步加 I（导入排序）、B（bugbear）、UP（语法升级）。
line-length = 110
target-version = "py313"

[lint]
select = ["F", "E9"]
exclude = [".venv", "data", "experiments"]

[lint.per-file-ignores]
# 测试里允许用私有函数（就是要直接测它们）、允许长断言
"tests/*" = ["F401"]
