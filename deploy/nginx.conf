# nginx：托管前端静态文件 + 反代后端。
# 为什么用它而不是让前端直连后端：生产只需要暴露一个端口，
# 顺手解决 CORS（同源就不存在 CORS），也能给 SSE 单独设不缓冲。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ^~ /api/ai/ { return 404; }
    location ^~ /community-api/internal/ { return 404; }
    location = /metrics { return 404; }

    # 前端是单页应用：任何未命中的路径都回 index.html，否则刷新子路由会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 必须单独配：默认的 proxy_buffering 会把事件攒起来一起发，
    # 进度条就会"卡住很久然后一次性全跳出来" —— 那样就白做流式了。
    location /api/trip/plan/stream/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;   # 一次规划几十秒，别被默认 60s 掐断
        chunked_transfer_encoding on;
    }

    # 社区服务（Java）：同源反代，和 Vite 开发代理是**同一套前缀**，
    # 所以前端代码里只出现相对地址 /community-api，两套环境行为一致。
    #
    # ★ 前缀带 -api 后缀是刻意的：前端有页面路由 /community，两者同名时
    #   nginx 的 location 会把整页导航也接走，刷新就白屏（开发环境已经踩过一次）。
    #   注意 proxy_pass 末尾的 /community/ —— 有 URI 部分时 nginx 会做前缀替换：
    #   /community-api/leaderboard  ->  http://community:8080/community/leaderboard
    location /community-api/ {
        proxy_pass http://community:8080/community/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 转发真实客户端 IP —— Java 的限流按客户端算，拿不到真实 IP 就变成"全局限流"
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;   # 同步接口也可能跑几十秒
    }

    location /health {
        proxy_pass http://backend:8000;
    }
}
