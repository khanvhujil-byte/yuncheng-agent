# nginx：托管前端静态文件 + 反代后端。
# 为什么用它而不是让前端直连后端：生产只需要暴露一个端口，
# 顺手解决 CORS（同源就不存在 CORS），也能给 SSE 单独设不缓冲。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端是单页应用：任何未命中的路径都回 index.html，否则刷新子路由会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 必须单独配：默认的 proxy_buffering 会把事件攒起来一起发，
    # 进度条就会"卡住很久然后一次性全跳出来" —— 那样就白做流式了。
    location /api/trip/plan/stream/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;   # 一次规划几十秒，别被默认 60s 掐断
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;   # 同步接口也可能跑几十秒
    }

    location /health {
        proxy_pass http://backend:8000;
    }
}
